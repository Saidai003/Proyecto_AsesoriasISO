services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: proyecto_iso
      MYSQL_USER: proyecto_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backend-js/seeds/seedISO_utf8.sql:/docker-entrypoint-initdb.d/02-seed-iso.sql:ro
      - ./backend-js/seeds/seed_users_workspaces.sql:/docker-entrypoint-initdb.d/03-seed-users.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional backend-js service example
  backend-js:
    build: ./backend-js
    env_file:
      - backend-js/.env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DB_HOST=mysql
      - DB_USER=proyecto_user
      - DB_PASSWORD=${DB_PASSWORD:-change_me}
      - DB_NAME=proyecto_iso
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret}
      - SEED_SECRET=${SEED_SECRET:-dev_seed_secret}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - GOOGLE_DRIVE_FOLDER_ID=${GOOGLE_DRIVE_FOLDER_ID}
      - SEEDS_DIR=/app/seeds
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend-js/.credentials:/app/.credentials
      - ./backend-js:/app
      - backend-js-node-modules:/app/node_modules
      - ./backend-js/seeds:/app/seeds:ro
      - ./.env.drive_token:/app/.env.drive_token

  # Optional backend-py service example
  # backend-py removed: Python backend no longer used

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      - VITE_BACKEND_URL=http://backend-js:3000
      - NODE_ENV=${NODE_ENV:-development}
    ports:
      - "5173:5173"
    depends_on:
      - backend-js

volumes:
  db_data:
  backend-js-node-modules:
