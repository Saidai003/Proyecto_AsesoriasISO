<div class="fixed inset-0 z-0 opacity-40 pointer-events-none">
<div class="absolute inset-0 tonal-sculpting"></div>
<div class="absolute top-0 right-0 w-[50vw] h-[512px] bg-primary-fixed/10 blur-[120px] rounded-full"></div>
<div class="absolute bottom-0 left-0 w-[40vw] h-[409px] bg-tertiary-fixed/10 blur-[100px] rounded-full"></div>
</div>
<main class="relative z-10 w-full max-w-[440px]">
<!-- Login Container -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_20px_40px_rgba(0,35,111,0.06)] overflow-hidden">
<!-- Brand Section -->
<div class="px-8 pt-10 pb-6 text-center">
<div class="flex flex-col items-center gap-3">
<div class="w-12 h-12 flex items-center justify-center bg-primary-fixed rounded-xl mb-2">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">
                            verified_user
                        </span>
</div>
<h1 class="text-2xl font-extrabold tracking-tighter text-primary">Sovereign QMS</h1>
<p class="text-sm font-medium text-on-secondary-container tracking-wide uppercase">Sovereign Archive Access</p>
</div>
</div>
<!-- Form Section -->
<form class="px-10 pb-10 space-y-6">
<div class="space-y-4">
<!-- Email Field -->
<div class="group">
<label class="block text-[10px] font-bold uppercase tracking-widest text-outline mb-1.5 ml-1" for="email">Correo Electrónico</label>
<div class="relative">
<input class="w-full px-4 py-3 bg-surface-container-high text-on-surface border-0 rounded-lg focus:ring-0 focus:border-b-2 focus:border-primary transition-all duration-200 placeholder:text-outline/50 text-sm" id="email" name="email" placeholder="nombre@archivo.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="group">
<div class="flex justify-between items-center mb-1.5">
<label class="block text-[10px] font-bold uppercase tracking-widest text-outline ml-1" for="password">Contraseña</label>
</div>
<div class="relative">
<input class="w-full px-4 py-3 bg-surface-container-high text-on-surface border-0 rounded-lg focus:ring-0 focus:border-b-2 focus:border-primary transition-all duration-200 placeholder:text-outline/50 text-sm" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<div class="flex items-center justify-between">
<a class="text-xs font-semibold text-on-primary-fixed-variant hover:text-primary transition-colors" href="#">
                        ¿Olvidé mi contraseña?
                    </a>
</div>
<!-- Primary Action -->
<button class="w-full primary-gradient text-on-primary font-bold py-3.5 rounded-xl shadow-md active:scale-[0.98] transition-all duration-200 text-sm tracking-tight" type="submit">
                    Ingresar
                </button>
<!-- Divider -->
<div class="relative py-2 flex items-center">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink mx-4 text-[10px] font-bold uppercase tracking-widest text-outline">O continuar con</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<!-- Secondary Action (Google) -->
<button class="w-full flex items-center justify-center gap-3 px-4 py-3 bg-surface border border-outline-variant/40 rounded-xl hover:bg-surface-container transition-all duration-200 group active:scale-[0.98]" type="button">

</svg>
<span class="text-sm font-semibold text-on-surface-variant group-hover:text-on-surface">Iniciar con Google</span>
</button>

</div>
